name: Update meteograms

on:
  schedule:
    # AMPS 00 and 12 UTC runs finish on the UCAR server about 10 h later (seen 09:20-10:40 and
    # 21:25-22:10 UTC). Check every 30 min through those windows; a check with nothing new exits
    # in seconds and commits nothing.
    # odd minutes: the top and half of the hour are when GitHub's scheduler is busiest
    - cron: "7,37 9-11 * * *"
    - cron: "7 12 * * *"
    - cron: "7,37 21-23 * * *"
    - cron: "7,37 0 * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild the page from the stored runs only (after a template change)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: meteograms
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Get the published site (state of the previous runs)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          else
            mkdir site
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -q -r requirements.txt

      - name: Make the update
        id: make
        env:
          NIVL_PROJECT_ROOT: ${{ runner.temp }}/amps
          MPLBACKEND: Agg
          AMPS_CHANGED_FLAG: ${{ runner.temp }}/site_changed
        run: |
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            python publish.py site --rebuild
          else
            python publish.py site
          fi
          if [ -f "$AMPS_CHANGED_FLAG" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "No new run: nothing to publish."; fi

      - name: Publish (gh-pages keeps a single commit, so the repository stays small)
        if: steps.make.outputs.changed == 'true'
        run: |
          cd site
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "meteogram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Meteograms $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
