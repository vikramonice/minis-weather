name: Keep the schedule alive

# GitHub disables scheduled workflows in a public repository after 60 days without activity.
# Once a month this records the date on the main branch, which counts as activity.

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%d %H:%M UTC" > .keepalive
          git config user.name "meteogram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .keepalive
          git commit -q -m "keepalive $(date -u +%Y-%m-%d)"
          git push -q
